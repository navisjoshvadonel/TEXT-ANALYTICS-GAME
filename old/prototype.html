ath d="m54 112 43-39 41 29M96 50v75M64 127h65"/><circle cx="57" cy="112" r="8" fill="#f0a47e"/><circle cx="138" cy="102" r="8" fill="#96b58e"/>`,grid:`<rect x="52" y="44" width="88" height="83" rx="8" fill="#fffefa"/><path d="M96 44v83M52 85h88"/><path d="m65 63 7 7 12-14m23 53 7 7 12-14" stroke="#7b9e71"/>`,check:`<circle cx="96" cy="87" r="47" fill="#e5efd8"/><path d="m72 88 17 17 34-39" stroke="#538358" stroke-width="7"/>`,cross:`<circle cx="96" cy="87" r="47" fill="#fae8db"/><path d="m78 69 36 36m0-36-36 36" stroke="#d37e5c" stroke-width="7"/>`,mask:`<path d="M54 74q42-31 84 0l-10 43q-32 29-64 0z" fill="#b8c8e2"/><path d="M55 82 38 62m100 20 17-20"/><circle cx="80" cy="88" r="4"/><circle cx="111" cy="88" r="4"/>`,shield:`<path d="M96 39 139 55v31q-4 33-43 52-39-19-43-52V55z" fill="#dcebd6"/><path d="m76 90 14 14 28-31" stroke-width="6"/>`};return `<svg viewBox="0 0 192 170" aria-hidden="true"><g fill="none" ${common}>${x[kind]||x.sparkle}</g></svg>`};
const defaultTeams=[{name:'Team Nova',gender:'boys',score:0},{name:'Team Luna',gender:'girls',score:0},{name:'Team Orbit',gender:'boys',score:0},{name:'Team Iris',gender:'girls',score:0},{name:'Team Pixel',gender:'boys',score:0},{name:'Team Bloom',gender:'girls',score:0}];
let state={phase:'lobby',round:'connection',idx:0,guess:'',typedAnswer:'',hint:false,wrong:0,done:false,teams:JSON.parse(localStorage.getItem('nlpquest-teams')||'null')||defaultTeams.map(t=>({...t})),active:localStorage.getItem('nlpquest-active')||'Team Luna',roundSolved:0,totalSolved:0,paused:false,seed:1,recent:'',sound:false,notice:''};
const root=document.getElementById('app');const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sorted=(gender)=>state.teams.filter(t=>t.gender===gender).sort((a,b)=>b.score-a.score).slice(0,5);const maxQuestions=state.round==='connection'?15:20;const question=()=>state.round==='connection'?conn[state.idx%conn.length]:hang[state.idx%hang.length];
const header=()=>`<header class="topbar"><div class="brand"><span class="brand-mark">N</span>NLP <em>Quest</em></div><nav class="nav"><button data-tab="game" class="${view==='game'?'active':''}">Play</button><button data-tab="host" class="${view==='host'?'active':''}" >Host</button><button data-tab="projector" class="${view==='projector'?'active':''}">Projector ↗</button></nav><span class="status">${state.phase==='lobby'?'LOBBY':state.paused?'PAUSED':'LIVE'}</span></header>`;
let view='game';function topIntro(){return `<div class="eyebrow">A little language, a lot of teamwork</div><h1 class="headline">Think together. Find the words.</h1><p class="subhead">A friendly NLP challenge for curious minds.</p><div class="round-strip"><span class="round-pill ${state.round==='connection'?'current':''}">01 &nbsp;PICTURE CONNECT</span><span class="strip-line"></span><span class="round-pill ${state.round==='hangman'?'current':''}">02 &nbsp;WORD BUILDER</span><span class="strip-count">${state.round==='connection'?state.idx+1:state.idx+1} / ${maxQuestions}</span></div>`}
function slots(q){return [...q.answer].map((c,i)=>c===' '?'<span class="slot space"></span>':`<span class="slot ${state.guess[i]?'filled':''} ${state.done?'correct':''}">${state.guess[i]?safe(state.guess[i]):''}</span>`).join('')}
function gameContent(){let q=question();if(state.round==='connection')return `<div class="game-top"><span class="unit-label">UNIT ${['I','II','III','IV','V'][q.unit-1]} · ${units[q.unit-1]}</span><span class="q-count">QUESTION ${String(state.idx+1).padStart(2,'0')} / 15</span></div><h2 class="question-title">What connects these pictures?</h2><p class="question-hint">Look closely. Talk it through. Find the NLP idea.</p><div class="pictures">${q.art.map((a,i)=>`<div class="picture appear" style="animation-delay:${i*55}ms">${art(a)}<span class="pic-no">CLUE 0${i+1}</span></div>`).join('')}</div><div class="answer-label">YOUR TEAM'S ANSWER</div><div class="slots">${slots(q)}</div><input class="answer-input" id="answerInput" aria-label="Type your answer" autocomplete="off" autocapitalize="characters" placeholder="Type your team's answer" value="${safe(state.typedAnswer)}" ${state.done?'disabled':''} /><div class="notice ${state.notice?'error':''}" aria-live="polite">${state.notice|| (state.hint?q.hint:'A small clue can get the conversation started')}</div><div class="game-actions"><button class="btn secondary" data-action="hint">✦ &nbsp;Hint</button><button class="btn primary" data-action="submit" ${state.done?'disabled':''}>${state.done?'Solved ✓':'Submit answer'}</button></div>`;
return `<div class="game-top"><span class="unit-label">UNIT ${['I','II','III','IV','V'][q.unit-1]} · ${units[q.unit-1]}</span><span class="q-count">PUZZLE ${String(state.idx+1).padStart(2,'0')} / 20</span></div><h2 class="question-title">Fill in the missing letters</h2><p class="question-hint">Take a breath. You have six gentle chances.</p><div class="hangman-wrap"><svg class="hang-svg" viewBox="0 0 170 190" aria-label="Friendly character drawing"><g fill="none" stroke="#728970" stroke-width="5" stroke-linecap="round" class="draw ${state.wrong>=1?'on':''}"><path d="M25 163h120"/></g><g fill="none" stroke="#728970" stroke-width="5" stroke-linecap="round" class="draw ${state.wrong>=2?'on':''}"><path d="M49 162V35"/></g><g fill="none" stroke="#728970" stroke-width="5" stroke-linecap="round" class="draw ${state.wrong>=3?'on':''}"><path d="M49 36h65"/><path d="M112 36v20"/></g>${state.wrong>=4?`<g class="appear"><circle cx="112" cy="72" r="17" fill="#f2c8a6" stroke="#526950" stroke-width="3"/><circle cx="106" cy="71" r="1.8" fill="#344638"/><circle cx="118" cy="71" r="1.8" fill="#344638"/><path d="M107 78q5 5 10 0" stroke="#344638" stroke-width="2" fill="none"/></g>`:''}${state.wrong>=5?`<g stroke="#526950" stroke-width="4" stroke-linecap="round" class="appear"><path d="M112 89v37m0-25-17 16m17-16 17 16"/><path d="M103 94q9 7 18 0" fill="none" stroke="#d89b73"/></g>`:''}${state.wrong>=6?`<g stroke="#526950" stroke-width="4" stroke-linecap="round" class="appear"><path d="m112 126-14 24m14-24 15 24"/></g>`:''}</svg><div><div class="clue"><b>CLUE</b><br>${safe(q.clue)}</div><div class="hang-slots" aria-label="Answer">${[...q.answer].map((c,i)=>c===' '?'&nbsp;&nbsp;':`<span>${state.guess[i]||'_'}</span>`).join('')}</div></div></div><div class="keyboard">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button class="key ${state.guess.includes(c)?(q.answer.includes(c)?'used':'wrong'):''}" data-letter="${c}" ${state.done?'disabled':''}>${c}</button>`).join('')}</div><div class="notice ${state.notice?'error':''}" aria-live="polite">${state.notice|| (state.hint?'Think about how this process works in a language model.':'Spaces are filled in automatically')}</div><div class="game-actions"><button class="btn secondary" data-action="hint">✦ &nbsp;Clue</button><button class="btn primary" data-action="submit" ${state.done?'disabled':''}>${state.done?'Solved ✓':'Submit answer'}</button></div>`}
function ranking(gender){let list=sorted(gender);return `<section class="side-card"><div class="side-head"><div class="side-title"><span>🏆</span>${gender==='girls'?"Girls’":"Boys’"} leaderboard</div><span class="mini-tag">TOP 5</span></div>${list.map((t,i)=>`<div class="team-row ${t.name===state.active?'you':''} ${t.name===state.recent?'recent':''}"><span class="rank">${i+1}</span><span class="avatar">${safe(t.name.split(' ').slice(-1)[0].slice(0,2).toUpperCase())}</span><span class="team-name">${safe(t.name)} ${t.name===state.active?'<span class="you-tag">YOUR TEAM</span>':''}</span><b class="points">${t.score}</b></div>`).join('')}</section>`}
function sidebar(){return `<aside class="side">${ranking('girls')}${ranking('boys')}<section class="side-card"><div class="side-head"><div class="side-title">Tonight so far</div><span class="mini-tag">IN THIS MATCH</span></div><div class="stats"><div class="stat"><strong>${state.teams.length}</strong><small>active teams</small></div><div class="stat"><strong>${state.totalSolved}</strong><small>questions solved</small></div></div><div class="progress"><i style="width:${Math.min(100,state.totalSolved/35*100)}%"></i></div></section></aside>`}
function hostPanel(){return `<section class="side-card host-panel ${view==='host'?'active':''}"><div class="side-head"><div class="side-title">Host desk</div><span class="mini-tag">CONTROLS</span></div><div class="host-section"><div class="host-label">PLAYING AS</div><div class="host-row"><select class="team-select" id="activeTeam">${state.teams.map(t=>`<option ${t.name===state.active?'selected':''}>${safe(t.name)}</option>`).join('')}</select><span style="font-size:10px;color:#838b80">Choose the team for this demo screen</span></div></div><div class="host-section"><div class="host-label">ADD A TEAM</div><div class="host-row"><input id="teamInput" placeholder="Team name" maxlength="22"><select id="genderSelect"><option value="girls">Girls</option><option value="boys">Boys</option></select><button class="btn secondary" data-action="addteam">Add</button></div></div><div class="host-section"><div class="host-label">MATCH CONTROL</div><div class="host-row"><button class="btn ${state.paused?'primary':'secondary'}" data-action="pause">${state.paused?'Resume round':'Pause round'}</button><button class="btn secondary" data-action="nextround">${state.round==='connection'?'Start Hangman':'Finish match'}</button></div><div class="host-row"><button class="btn secondary" data-action="reset">New match</button><button class="btn secondary" data-action="csv">Export CSV</button></div></div><div class="host-section"><div class="host-label">TEAMS · ${state.teams.length} REGISTERED</div><div class="host-list">${state.teams.map(t=>`${safe(t.name)} · ${t.gender} · ${t.score} pts`).join('<br>')}</div></div><div class="host-section"><button class="ghost" data-action="sound">${state.sound?'♪ Sound on':'♪ Sound off'}</button><span style="font-size:10px;color:#888"> &nbsp; · &nbsp; local prototype</span></div></section>`}
function gameView(){return `${header()}<main class="main"><section><div class="eyebrow">A little language, a lot of teamwork</div><h1 class="headline">Think together. Find the words.</h1><p class="subhead">A friendly NLP challenge for curious minds.</p><div class="round-strip"><span class="round-pill ${state.round==='connection'?'current':''}">01 &nbsp;PICTURE CONNECT</span><span class="strip-line"></span><span class="round-pill ${state.round==='hangman'?'current':''}">02 &nbsp;WORD BUILDER</span><span class="strip-count">${state.idx+1} / ${maxQuestions}</span></div><article class="game-card ${state.paused?'paused':''}">${state.paused?'<div style="text-align:center;padding:56px 12px"><div class="eyebrow">A little breather</div><h2 class="question-title">Round paused</h2><p class="subhead">Your team’s progress is safe. The host will get you moving again.</p></div>':gameContent()}</article></section><div>${view==='host'?hostPanel():sidebar()}${view!=='host'?'<section class="side-card" style="margin-top:13px"><div class="side-head"><div class="side-title">Team room</div><span class="mini-tag">4 PLAYERS</span></div><div class="team-row you"><span class="avatar">LU</span><span class="team-name">Team Luna</span><span class="you-tag">LEADER</span></div><p style="font-size:10px;line-height:1.6;color:#848b80;margin-bottom:0">Discuss each clue together. Your team leader sends the final answer.</p></section>':''}</div></main>`}
function projection(){return `${header()}<main class="main"><div class="hero-center"><div class="eyebrow">Interactive learning arena</div><h1 class="headline">NLP QUEST</h1><p class="subhead">A bright idea is always a team effort.</p><div class="round-strip"><span class="round-pill current">ROUND ${state.round==='connection'?'01':'02'}</span><span class="round-pill current">${state.round==='connection'?'PICTURE CONNECT':'WORD BUILDER'}</span><span class="status">${state.paused?'PAUSED':'LIVE'}</span></div></div><div class="leader-grid">${ranking('girls')}${ranking('boys')}</div><div class="bottom-stats"><div class="stat"><strong>${state.teams.length}</strong><small>ACTIVE TEAMS</small></div><div class="stat"><strong>${state.totalSolved}</strong><small>QUESTIONS SOLVED</small></div></div><div class="bottom-progress"><div class="round-progress-label">MATCH PROGRESS &nbsp; ${state.round==='connection'?'ROUND 1 OF 2':'ROUND 2 OF 2'}</div><div class="progress"><i style="width:${state.round==='connection'?Math.min(50,state.totalSolved/15*50):50+Math.min(50,(state.totalSolved-15)/20*50)}%"></i></div></div></main>`}
function render(){document.body.classList.toggle('projector',view==='projector');root.innerHTML=`<div class="shell">${view==='projector'?projection():gameView()}</div>`;if(view==='host'){document.querySelector('.side')?.classList.add('host-mode');document.querySelector('.side').innerHTML=hostPanel();document.getElementById('activeTeam')?.addEventListener('change',e=>{state.active=e.target.value;save();render()})}const ai=document.getElementById('answerInput');if(ai){ai.addEventListener('input',()=>{state.typedAnswer=ai.value});ai.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
function newQuestion(){state.idx++;state.guess='';state.typedAnswer='';state.wrong=0;state.hint=false;state.done=false;state.notice='';if(state.idx>=(state.round==='connection'?15:20)){state.idx=(state.round==='connection'?15:20)-1;state.done=true;state.phase='results';toast(state.round==='connection'?'Picture Connect complete! Host can start the next round.':'Match complete! View the final leaderboard.')}render()}
function chooseLetter(c){if(state.done||state.paused||state.round!=='hangman')return;let q=question();if(state.guess.includes(c))return;state.guess+=c;if(!q.answer.includes(c))state.wrong++;if([...q.answer].every((x,i)=>x===' '||state.guess[i])){state.done=true;state.totalSolved++;state.roundSolved++;let team=state.teams.find(t=>t.name===state.active);if(team){team.score+=75;state.recent=team.name}state.notice='Lovely teamwork! The answer is '+q.answer+'.';save();setTimeout(()=>{render();toast('+75 points for '+state.active)},280)}else if(state.round==='hangman'&&state.wrong>=6){state.done=true;state.notice='The character is all here. The answer was '+q.answer+'.';setTimeout(()=>render(),250)}render()}
function submit(){if(state.done||state.paused)return;let q=question();if(state.round==='connection'){let entered=state.typedAnswer.trim().toUpperCase().replace(/[^A-Z]/g,'');let answer=q.answer.replace(/[^A-Z]/g,'');if(entered===answer){state.done=true;state.totalSolved++;state.roundSolved++;let team=state.teams.find(t=>t.name===state.active);if(team){team.score+=100;state.recent=team.name}state.notice='You found it! '+q.answer+' is right.';save();render();setTimeout(()=>toast('+100 points for '+state.active),180)}else{state.notice='Not quite yet. Try another combination of letters.';document.querySelector('.game-card')?.classList.add('shake');setTimeout(()=>{state.notice='';render()},700)}}else if([...q.answer].every((x,i)=>x===' '||state.guess[i])){state.done=true;state.totalSolved++;state.roundSolved++;let t=state.teams.find(t=>t.name===state.active);if(t){t.score+=75;state.recent=t.name}state.notice='Nicely solved! '+q.answer;save();render();toast('+75 points for '+state.active)}}
function csv(){let rows=[['Rank','Team','Category','Score'],...state.teams.slice().sort((a,b)=>b.score-a.score).map((t,i)=>[i+1,t.name,t.gender,t.score])];let blob=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nlp-quest-results.csv';a.click();URL.revokeObjectURL(a.href)}
function save(){localStorage.setItem('nlpquest-teams',JSON.stringify(state.teams));localStorage.setItem('nlpquest-active',state.active)}
root.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){view=tab.dataset.tab;render();return}let l=e.target.closest('[data-letter]');if(l){chooseLetter(l.dataset.letter);return}let act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;if(act==='hint'){state.hint=true;render()}if(act==='submit')submit();if(act==='pause'){state.paused=!state.paused;render()}if(act==='nextround'){if(state.round==='connection'){state.round='hangman';state.idx=0;state.guess='';state.typedAnswer='';state.wrong=0;state.done=false;state.phase='live';state.paused=false;state.notice=''}else{state.phase='results';view='projector';toast('The final leaderboard is ready.')}render()}if(act==='reset'){if(confirm('Start a fresh match and reset scores?')){state={...state,phase:'lobby',round:'connection',idx:0,guess:'',typedAnswer:'',hint:false,wrong:0,done:false,teams:defaultTeams.map(t=>({...t})),active:'Team Luna',roundSolved:0,totalSolved:0,paused:false,recent:'',notice:''};save();view='game';render()}}if(act==='csv')csv();if(act==='addteam'){let input=document.getElementById('teamInput'),sel=document.getElementById('genderSelect'),name=input?.value.trim();if(name&&!state.teams.some(t=>t.name.toLowerCase()===name.toLowerCase())){state.teams.push({name,gender:sel.value,score:0});save();render();toast(name+' joined the lobby')}else if(name)toast('That team name is already in play')}if(act==='sound'){state.sound=!state.sound;render()}});
document.addEventListener('keydown',e=>{if(view!=='game'||e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,select'))return;if(/^[a-z]$/i.test(e.key))chooseLetter(e.key.toUpperCase());else if(e.key==='Enter')submit()});
render();
</script></body></html>
